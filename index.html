<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OSINT Tool</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="container">

        <header>
            <div class="logo">
                <span class="logo-icon">🛡️</span>
                <span class="logo-text">OSINT<span>Pro</span></span>
            </div>
            <span class="version">v3.0</span>
        </header>

        <nav class="tabs">
            <button class="tab active" data-tab="ip">🌐 IP-локатор</button>
            <button class="tab" data-tab="phone">📞 Phone-инфо</button>
            <button class="tab" data-tab="social">🔍 Соц-чекер</button>
            <button class="tab" data-tab="logger">🎯 IP-логгер</button>
        </nav>

        <section id="ip" class="tab-content active">
            <h2>🌐 Геолокация по IP</h2>
            <div class="input-group">
                <input type="text" id="ipInput" placeholder="Введите IP" />
                <button class="btn" id="ipBtn">🔍 Найти</button>
                <button class="btn-small" onclick="copyResult('ipResult')">📋</button>
            </div>
            <div id="ipResult" class="result-card"></div>
        </section>

        <section id="phone" class="tab-content">
            <h2>📞 Информация по номеру</h2>
            <div class="input-group">
                <input type="text" id="phoneInput" placeholder="+79261234567" />
                <button class="btn" id="phoneBtn">🔍 Найти</button>
                <button class="btn-small" onclick="copyResult('phoneResult')">📋</button>
            </div>
            <div id="phoneResult" class="result-card"></div>
        </section>

        <section id="social" class="tab-content">
            <h2>🔍 Проверка в соцсетях</h2>
            <div class="input-group">
                <input type="text" id="socialInput" placeholder="Юзернейм или номер" />
                <button class="btn" id="socialBtn">🔍 Проверить</button>
                <button class="btn-small" onclick="copyResult('socialResult')">📋</button>
            </div>
            <div id="socialResult" class="result-card"></div>
        </section>

        <section id="logger" class="tab-content">
            <h2>🎯 IP-логгер</h2>
            <div class="input-group">
                <input type="text" id="loggerInput" placeholder="URL для маскировки" value="youtube.com" />
                <button class="btn" id="loggerBtn">⚡ Создать ссылку</button>
                <button class="btn-small" onclick="copyResult('loggerResult')">📋</button>
            </div>
            <div id="loggerResult" class="result-card"></div>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
